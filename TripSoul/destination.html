<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripSoul | Destination Handbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #080C14;
      --bg-surface:   #0E1320;
      --bg-raise:     #141A2A;
      --gold:         #E8A838;
      --gold-dim:     rgba(232,168,56,0.12);
      --gold-border:  rgba(232,168,56,0.22);
      --gold-glow:    rgba(232,168,56,0.06);
      --green:        #4CC9A0;
      --green-dim:    rgba(76,201,160,0.1);
      --green-border: rgba(76,201,160,0.22);
      --red:          #E05C5C;
      --red-dim:      rgba(224,92,92,0.08);
      --red-border:   rgba(224,92,92,0.22);
      --cream:        #F0EAD6;
      --muted:        rgba(240,234,214,0.45);
      --faint:        rgba(240,234,214,0.18);
      --rule:         rgba(255,255,255,0.06);
      --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Instrument Sans', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
      min-height: 100vh;
      background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* ── Loader ── */
    #loading-overlay {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; transition: opacity 0.5s ease;
    }
    #loading-overlay.hide { opacity: 0; pointer-events: none; }
    .loader-orb {
      width: 56px; height: 56px; border-radius: 50%;
      border: 1.5px solid var(--gold-border);
      position: relative;
      animation: pulse 2s ease-in-out infinite;
    }
    .loader-orb::before {
      content: ''; position: absolute; inset: 6px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: var(--gold);
      animation: spin 1s linear infinite;
    }
    .loader-orb::after {
      content: ''; position: absolute; inset: 14px;
      border-radius: 50%; background: var(--gold-dim);
      animation: pulse 2s ease-in-out infinite reverse;
    }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
    .loader-text {
      margin-top: 20px; font-family: 'Syne', sans-serif;
      font-size: 10px; letter-spacing: 0.24em;
      text-transform: uppercase; color: var(--muted);
    }
    .loader-dots::after {
      content: ''; animation: dots 1.4s steps(4,end) infinite;
    }
    @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

    /* ── Reveal animation ── */
    .reveal {
      opacity: 0; transform: translateY(20px);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    .reveal.visible { opacity: 1; transform: none; }
    .sg .reveal:nth-child(1){transition-delay:.04s}
    .sg .reveal:nth-child(2){transition-delay:.11s}
    .sg .reveal:nth-child(3){transition-delay:.18s}
    .sg .reveal:nth-child(4){transition-delay:.25s}
    .sg .reveal:nth-child(5){transition-delay:.32s}

    /* ── Layout ── */
    .page-wrap { max-width: 900px; margin: 0 auto; padding: 3rem 2rem 6rem; }

    .back-link {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--muted); text-decoration: none;
      font-size: 12px; letter-spacing: 0.07em;
      margin-bottom: 3rem;
      transition: color 0.2s, gap 0.2s;
    }
    .back-link:hover { color: var(--gold); gap: 12px; }
    .back-link:hover svg { transform: translateX(-3px); }
    .back-link svg { transition: transform 0.2s; }

    /* ── Hero ── */
    .hero {
      margin-bottom: 3.5rem; padding-bottom: 2.5rem;
      border-bottom: 1px solid var(--rule);
      position: relative;
    }
    .hero::after {
      content: ''; position: absolute;
      bottom: -1px; left: 0; width: 72px; height: 1px;
      background: var(--gold);
    }
    .hero-state {
      font-family: 'Syne', sans-serif;
      font-size: 10px; letter-spacing: 0.26em;
      text-transform: uppercase; color: var(--gold);
      margin-bottom: 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .hero-state::before {
      content: ''; display: inline-block;
      width: 18px; height: 1px; background: var(--gold);
    }
    .hero-name {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 700; line-height: 1;
      letter-spacing: -0.02em; color: var(--cream);
      margin-bottom: 14px;
    }
    .hero-tagline {
      font-size: 1rem; font-style: italic; font-weight: 300;
      color: var(--muted); line-height: 1.7; max-width: 54ch;
    }

    /* ── Image strip ── */
    .img-strip {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 8px; margin: 1.8rem 0 2.5rem;
    }
    .img-placeholder {
      aspect-ratio: 4/3; background: var(--bg-surface);
      border: 1px solid var(--rule); border-radius: var(--r-md);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 7px; color: var(--faint);
      font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
      position: relative; overflow: hidden;
      transition: border-color 0.25s;
    }
    .img-placeholder::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 55%, var(--gold-glow));
      opacity: 0; transition: opacity 0.3s;
    }
    .img-placeholder:hover { border-color: var(--gold-border); }
    .img-placeholder:hover::after { opacity: 1; }

    /* ── Stat grid ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(168px,1fr));
      gap: 10px; margin-bottom: 2.5rem;
    }
    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--rule);
      border-radius: var(--r-md);
      padding: 1.4rem 1.2rem;
      position: relative; overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .stat-card::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      border-radius: var(--r-md) var(--r-md) 0 0;
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-card.green { background: var(--green-dim); border-color: var(--green-border); }
    .stat-card.gold  { background: var(--gold-dim);  border-color: var(--gold-border); }
    .stat-card.red   { background: var(--red-dim);   border-color: var(--red-border); }
    .stat-card.green::before { background: var(--green); }
    .stat-card.gold::before  { background: var(--gold); }
    .stat-card.red::before   { background: var(--red); }
    .stat-label {
      font-family: 'Syne', sans-serif;
      font-size: 9px; text-transform: uppercase;
      letter-spacing: 0.18em; margin-bottom: 8px;
    }
    .stat-card.green .stat-label { color: var(--green); }
    .stat-card.gold  .stat-label { color: var(--gold); }
    .stat-card.red   .stat-label { color: var(--red); }
    .stat-value { font-size: 1.75rem; font-weight: 600; line-height: 1; }
    .stat-card.green .stat-value { color: var(--green); }
    .stat-card.gold  .stat-value { color: var(--gold); }
    .stat-card.red   .stat-value { color: var(--red); }
    .stat-note { font-size: 11.5px; color: var(--muted); margin-top: 7px; line-height: 1.5; }

    /* ── Section ── */
    .section { margin-bottom: 2.5rem; padding-bottom: 2.5rem; border-bottom: 1px solid var(--rule); }
    .section:last-child { border-bottom: none; margin-bottom: 0; }
    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 9px; text-transform: uppercase;
      letter-spacing: 0.24em; color: var(--gold);
      margin-bottom: 1.2rem;
      display: flex; align-items: center; gap: 10px;
    }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--rule); }

    /* ── Budget ── */
    .budget-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .budget-tier {
      background: var(--bg-surface); border: 1px solid var(--rule);
      border-radius: var(--r-md); padding: 1.2rem 1rem; text-align: center;
      transition: border-color 0.2s, background 0.2s, transform 0.2s;
    }
    .budget-tier:hover { border-color: var(--gold-border); background: var(--bg-raise); transform: translateY(-2px); }
    .budget-tier-label {
      font-family: 'Syne', sans-serif; font-size: 9px;
      text-transform: uppercase; letter-spacing: 0.16em;
      color: var(--faint); margin-bottom: 8px;
    }
    .budget-tier-value { font-size: 14px; font-weight: 500; color: var(--gold); }

    /* ── Transport ── */
    .transport-list { display: flex; flex-direction: column; gap: 8px; }
    .transport-item {
      display: grid; grid-template-columns: 86px 1fr;
      gap: 14px; align-items: start;
      background: var(--bg-surface); border: 1px solid var(--rule);
      border-radius: var(--r-md); padding: 1.1rem 1.3rem;
      transition: border-color 0.2s, background 0.2s;
    }
    .transport-item:hover { border-color: var(--gold-border); background: var(--bg-raise); }
    .transport-mode {
      font-family: 'Syne', sans-serif; font-size: 9px;
      text-transform: uppercase; letter-spacing: 0.16em;
      color: var(--gold); font-weight: 600; padding-top: 3px;
    }
    .transport-detail { font-size: 13px; color: var(--muted); line-height: 1.65; }

    /* ── Activities ── */
    .activity-row {
      display: grid; grid-template-columns: 94px 1fr;
      gap: 14px; align-items: start;
      padding: 12px 0; border-bottom: 1px solid var(--rule);
    }
    .activity-row:last-child { border-bottom: none; }
    .activity-who {
      font-family: 'Syne', sans-serif; font-size: 9px;
      color: var(--gold); text-transform: uppercase;
      letter-spacing: 0.14em; padding-top: 6px;
    }
    .pill-group { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill {
      background: var(--gold-dim); border: 1px solid var(--gold-border);
      border-radius: var(--r-sm); padding: 5px 12px;
      font-size: 12px; color: var(--gold);
      transition: background 0.15s, transform 0.15s; cursor: default;
    }
    .pill:hover { background: rgba(232,168,56,0.2); transform: translateY(-1px); }
    .pill.neutral {
      background: rgba(255,255,255,0.04);
      border-color: var(--rule); color: var(--muted);
    }

    /* ── Food ── */
    .food-col-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .food-col-title {
      font-family: 'Syne', sans-serif; font-size: 9px;
      text-transform: uppercase; letter-spacing: 0.16em;
      color: var(--faint); margin-bottom: 10px;
    }
    .food-item {
      font-size: 13px; color: var(--muted);
      padding: 6px 0; border-bottom: 1px solid var(--rule);
      line-height: 1.5; display: flex; align-items: baseline; gap: 8px;
    }
    .food-item:last-child { border-bottom: none; }
    .food-item::before { content: '▸'; color: var(--gold); font-size: 9px; flex-shrink: 0; }

    /* ── Experiences ── */
    .exp-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 11px 0; border-bottom: 1px solid var(--rule);
    }
    .exp-row:last-child { border-bottom: none; }
    .exp-name { font-size: 13px; color: var(--cream); }
    .exp-meta { text-align: right; }
    .exp-cost { font-size: 13px; color: var(--gold); font-weight: 500; }
    .exp-dur  { font-size: 11px; color: var(--faint); margin-top: 2px; }

    /* ── Tips ── */
    .tip-row {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 9px 0; border-bottom: 1px solid var(--rule);
    }
    .tip-row:last-child { border-bottom: none; }
    .tip-arrow { color: var(--gold); flex-shrink: 0; font-size: 13px; line-height: 1.65; }
    .tip-text  { font-size: 13px; color: var(--muted); line-height: 1.65; }

    /* ── Accessibility ── */
    .access-row {
      display: grid; grid-template-columns: 1fr auto;
      gap: 14px; align-items: start;
      padding: 10px 0; border-bottom: 1px solid var(--rule);
    }
    .access-row:last-child { border-bottom: none; }
    .access-site { font-size: 13px; color: var(--cream); }
    .access-note { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
    .wc-badge {
      font-family: 'Syne', sans-serif; font-size: 9px;
      font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 4px 11px; border-radius: var(--r-sm); white-space: nowrap;
    }
    .wc-yes { background: var(--green-dim); color: var(--green); border: 1px solid var(--green-border); }
    .wc-no  { background: var(--red-dim);   color: var(--red);   border: 1px solid var(--red-border); }

    /* ── Pers table ── */
    .pers-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .pers-table th {
      text-align: left; padding: 9px 12px;
      font-family: 'Syne', sans-serif; font-size: 9px;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--faint); border-bottom: 1px solid var(--rule); font-weight: 400;
    }
    .pers-table td {
      padding: 10px 12px; color: var(--muted);
      border-bottom: 1px solid var(--rule); vertical-align: top; line-height: 1.5;
    }
    .pers-table tr:last-child td { border-bottom: none; }
    .pers-table td:first-child { color: var(--gold); font-weight: 500; }

    /* ── Heritage ── */
    .heritage-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .heritage-card {
      background: var(--bg-surface); border: 1px solid var(--rule);
      border-radius: var(--r-md); padding: 1.1rem 1.2rem;
      transition: border-color 0.2s;
    }
    .heritage-card:hover { border-color: var(--gold-border); }
    .heritage-card-title {
      font-family: 'Syne', sans-serif; font-size: 10px;
      font-weight: 600; color: var(--cream); margin-bottom: 8px; letter-spacing: 0.04em;
    }
    .heritage-card-body { font-size: 12px; color: var(--muted); line-height: 1.6; }

    /* ── Festivals ── */
    .festival-row {
      display: grid; grid-template-columns: 72px 1fr;
      gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--rule);
    }
    .festival-row:last-child { border-bottom: none; }
    .festival-month {
      font-family: 'Syne', sans-serif; font-size: 9px;
      text-transform: uppercase; letter-spacing: 0.16em;
      color: var(--gold); padding-top: 3px;
    }
    .festival-name { font-size: 13px; font-weight: 500; color: var(--cream); margin-bottom: 4px; }
    .festival-desc { font-size: 12px; color: var(--muted); line-height: 1.5; }

    /* ── Responsible ── */
    .resp-cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .resp-col-title {
      font-family: 'Syne', sans-serif; font-size: 9px;
      text-transform: uppercase; letter-spacing: 0.16em;
      color: var(--gold); margin-bottom: 10px;
    }
    .resp-item {
      font-size: 12px; color: var(--muted);
      padding: 5px 0; line-height: 1.55; border-bottom: 1px solid var(--rule);
    }
    .resp-item:last-child { border-bottom: none; }

    /* ── Day trips ── */
    .trips-wrap { display: flex; flex-wrap: wrap; gap: 7px; }
    .trip-pill {
      background: var(--bg-surface); border: 1px solid var(--rule);
      border-radius: var(--r-sm); padding: 6px 14px;
      font-size: 12px; color: var(--muted);
      transition: border-color 0.2s, color 0.2s;
    }
    .trip-pill:hover { border-color: var(--gold-border); color: var(--gold); }

    /* ── Emergency ── */
    .emergency-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(148px,1fr)); gap: 8px; }
    .emergency-card {
      background: var(--red-dim); border: 1px solid var(--red-border);
      border-radius: var(--r-md); padding: 1.1rem 1.2rem;
    }
    .emergency-label {
      font-family: 'Syne', sans-serif; font-size: 9px;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--red); margin-bottom: 6px;
    }
    .emergency-value { font-size: 15px; font-weight: 600; color: var(--cream); }

    /* ── Seasons ── */
    .season-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(152px,1fr)); gap: 8px; }
    .season-card {
      background: var(--bg-surface); border: 1px solid var(--rule);
      border-radius: var(--r-md); padding: 1.1rem 1.2rem;
      transition: border-color 0.2s, transform 0.2s;
    }
    .season-card:hover { border-color: var(--gold-border); transform: translateY(-2px); }
    .season-name {
      font-family: 'Syne', sans-serif; font-size: 11px;
      font-weight: 600; color: var(--cream); margin-bottom: 6px;
    }
    .season-cond { font-size: 12px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
    .crowd-pill {
      display: inline-block; font-family: 'Syne', sans-serif;
      font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 3px 10px; border-radius: var(--r-sm);
    }
    .crowd-high   { background: rgba(224,92,92,0.12);  color: var(--red);   border: 1px solid var(--red-border); }
    .crowd-medium { background: var(--gold-dim);         color: var(--gold);  border: 1px solid var(--gold-border); }
    .crowd-low    { background: var(--green-dim);        color: var(--green); border: 1px solid var(--green-border); }

    /* ── Media ── */
    .media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .media-card {
      background: var(--bg-surface); border: 1px solid var(--rule);
      border-radius: var(--r-md); padding: 1.1rem 1.2rem; transition: border-color 0.2s;
    }
    .media-card:hover { border-color: var(--gold-border); }
    .media-card-title {
      font-family: 'Syne', sans-serif; font-size: 9px;
      text-transform: uppercase; letter-spacing: 0.16em;
      color: var(--gold); margin-bottom: 10px;
    }
    .media-item {
      font-size: 12px; color: var(--muted); padding: 4px 0;
      border-bottom: 1px solid var(--rule); line-height: 1.5;
    }
    .media-item:last-child { border-bottom: none; }
    .media-item::before { content: "– "; color: var(--gold); }

    /* ── Avoid box ── */
    .avoid-box {
      background: var(--red-dim); border: 1px solid var(--red-border);
      border-radius: var(--r-md); padding: 1.3rem 1.4rem;
      position: relative; overflow: hidden;
    }
    .avoid-box::before {
      content: '!'; position: absolute; right: 1.4rem; top: 50%;
      transform: translateY(-50%);
      font-family: 'Syne', sans-serif; font-size: 5rem; font-weight: 700;
      color: rgba(224,92,92,0.06); line-height: 1; pointer-events: none;
    }
    .avoid-label {
      font-family: 'Syne', sans-serif; font-size: 9px;
      text-transform: uppercase; letter-spacing: 0.18em;
      color: var(--red); margin-bottom: 7px;
    }
    .avoid-text { font-size: 13px; color: var(--muted); line-height: 1.65; max-width: 80%; }

    /* ── Footer ── */
    .page-footer {
      text-align: center; margin-top: 5rem;
      font-family: 'Syne', sans-serif; font-size: 10px;
      letter-spacing: 0.16em; color: var(--faint);
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .page-wrap { padding: 2rem 1.2rem 5rem; }
      .food-col-grid, .heritage-grid, .resp-cols, .media-grid { grid-template-columns: 1fr; }
      .budget-grid { grid-template-columns: 1fr; }
      .transport-item { grid-template-columns: 66px 1fr; }
      .img-strip { grid-template-columns: 1fr 1fr; }
      .img-strip .img-placeholder:last-child { display: none; }
    }
  </style>
</head>
<body>

<div id="loading-overlay">
  <div class="loader-orb"></div>
  <p class="loader-text">Gathering intelligence<span class="loader-dots"></span></p>
</div>

<div class="page-wrap" id="main-content" style="display:none">
  <a href="index.html" class="back-link">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.4">
      <path d="M9.5 12.5L4.5 7.5l5-5"/>
    </svg>
    Back to recommendations
  </a>
  <div id="handbook-body"></div>
  <div class="page-footer">TripSoul V4.0 Intelligence &nbsp;·&nbsp; Powered by Gemini</div>
</div>

<script>
  const API_URL = 'http://127.0.0.1:8000';
  const params  = new URLSearchParams(window.location.search);
  const city    = params.get('city');

  function asArray(v) {
    if (!v) return [];
    if (Array.isArray(v)) return v;
    if (typeof v === 'object') return Object.values(v);
    return [String(v)];
  }
  function crowdClass(l) {
    if (!l) return 'crowd-medium';
    l = l.toLowerCase();
    return l.includes('high') ? 'crowd-high' : l.includes('low') ? 'crowd-low' : 'crowd-medium';
  }
  function renderConnectivity(conn) {
    if (!conn) return '<p style="color:var(--faint);font-size:13px">Not available</p>';
    if (typeof conn === 'string')
      return `<div class="transport-item reveal"><div class="transport-mode">Route</div><div class="transport-detail">${conn}</div></div>`;
    if (Array.isArray(conn) && conn[0]?.mode)
      return conn.map(t => `
        <div class="transport-item reveal">
          <div class="transport-mode">${t.mode}</div>
          <div class="transport-detail">${t.details||''}
            ${t.cost_range_inr?`<br><span style="color:var(--gold);font-size:12px">₹${t.cost_range_inr}</span>`:''}
            ${t.booking_tip?`<br><span style="font-size:11px;color:var(--faint)">Tip: ${t.booking_tip}</span>`:''}
          </div>
        </div>`).join('');
    if (typeof conn === 'object')
      return Object.entries(conn).map(([m,d])=>`
        <div class="transport-item reveal">
          <div class="transport-mode">${m}</div>
          <div class="transport-detail">${d}</div>
        </div>`).join('');
    return '';
  }

  function renderHandbook(d) {
    const body = document.getElementById('handbook-body');
    const rt   = d.Real_Time_Content || d.real_time || {};

    body.innerHTML += `
      <div class="hero reveal">
        <div class="hero-state">${d.state||d.Overview?.destination_name?.split(',')[1]?.trim()||''}</div>
        <h1 class="hero-name">${d.city||d.Overview?.destination_name?.split(',')[0]||city}</h1>
        <p class="hero-tagline">${d.tagline||d.Overview?.tagline||''}</p>
      </div>`;

    const imgs = d.Overview?.hero_images||[
      {scene:'Destination landscape',mood:'Cinematic',time_of_day:'Golden Hour'},
      {scene:'Local food & culture',mood:'Vibrant',time_of_day:'Noon'},
      {scene:'Places & landmarks',mood:'Serene',time_of_day:'Dawn'}
    ];
    body.innerHTML += `<div class="img-strip sg">${imgs.map(i=>`
      <div class="img-placeholder reveal">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
        </svg>
        <span style="font-size:9px;text-align:center;padding:0 10px;line-height:1.4">${i.scene}</span>
        <span style="font-size:8px;color:var(--faint)">${i.mood} · ${i.time_of_day}</span>
      </div>`).join('')}</div>`;

    const safetyScore = d.safety_score||d.Safety_And_Accessibility?.safety_score||'–';
    const aqiVal      = d.aqi?.value||d.aqi?.avg_aqi||rt.aqi?.avg_aqi||'–';
    const bestTime    = (d.best_time||rt.best_time_to_visit||'').split(' ').slice(0,3).join(' ')||'–';
    body.innerHTML += `
      <div class="stat-grid sg">
        <div class="stat-card green reveal">
          <div class="stat-label">Safety score</div>
          <div class="stat-value">${safetyScore}<span style="font-size:1rem;font-weight:300;opacity:.6">/10</span></div>
          <div class="stat-note">${d.safety_note||''}</div>
        </div>
        <div class="stat-card gold reveal">
          <div class="stat-label">AQI · ${d.aqi?.season||rt.aqi?.season||'Current'}</div>
          <div class="stat-value">${aqiVal}</div>
          <div class="stat-note">${d.aqi?.advisory||rt.aqi?.advisory||''}</div>
        </div>
        <div class="stat-card gold reveal">
          <div class="stat-label">Best time to visit</div>
          <div class="stat-value" style="font-size:1.1rem;line-height:1.2">${bestTime}</div>
          <div class="stat-note">${d.best_time||rt.best_time_to_visit||''}</div>
        </div>
        ${d.accessibility?`
        <div class="stat-card ${d.accessibility.wheelchair?'green':'red'} reveal">
          <div class="stat-label">Wheelchair access</div>
          <div class="stat-value" style="font-size:1.1rem">${d.accessibility.wheelchair?'Yes':'Limited'}</div>
          <div class="stat-note">${d.accessibility.notes||''}</div>
        </div>`:''}
      </div>`;

    const bpd = d.budget_per_day||d.Budget_Insights;
    if (bpd) {
      let tiers = {};
      if (Array.isArray(bpd)) bpd.forEach(b=>{tiers[b.category]=`₹${b.budget_inr}`;});
      else tiers = bpd;
      body.innerHTML += `
        <div class="section reveal">
          <div class="section-title">Daily budget per person</div>
          <div class="budget-grid sg">${Object.entries(tiers).map(([t,v])=>`
            <div class="budget-tier reveal">
              <div class="budget-tier-label">${t}</div>
              <div class="budget-tier-value">${v}</div>
            </div>`).join('')}
          </div>
        </div>`;
    }

    body.innerHTML += `
      <div class="section">
        <div class="section-title">Getting there</div>
        <div class="transport-list">${renderConnectivity(d.connectivity||d.Travel_Planning)}</div>
      </div>`;

    const ttd=d.Things_To_Do||d.things_to_do, topExp=d.top_experiences;
    if (ttd&&Array.isArray(ttd)&&ttd[0]?.traveler_type) {
      body.innerHTML += `
        <div class="section reveal">
          <div class="section-title">Things to do</div>
          ${ttd.map(t=>`
            <div class="activity-row">
              <div class="activity-who">${t.traveler_type}</div>
              <div class="pill-group">${asArray(t.activities).map(a=>`<span class="pill">${a}</span>`).join('')}</div>
            </div>`).join('')}
        </div>`;
    } else if (topExp?.length) {
      body.innerHTML += `
        <div class="section reveal">
          <div class="section-title">Top experiences</div>
          ${topExp.map(e=>`
            <div class="exp-row">
              <div class="exp-name">${e.name||e}</div>
              <div class="exp-meta">
                ${e.cost?`<div class="exp-cost">${e.cost}</div>`:''}
                ${e.duration?`<div class="exp-dur">${e.duration}</div>`:''}
              </div>
            </div>`).join('')}
        </div>`;
    }

    const food=d.Food_And_Dining||{};
    const mustTry=asArray(food.must_try_dishes||d.must_try_food);
    const fineDining=asArray(food.fine_dining||d.fine_dining);
    const cafes=asArray(food.cafe_picks||d.cafes);
    const hygiene=asArray(food.hygiene_tips);
    if (mustTry.length||fineDining.length||cafes.length) {
      body.innerHTML += `
        <div class="section reveal">
          <div class="section-title">Food & dining</div>
          <div style="margin-bottom:16px">
            <div class="food-col-title">Must-try dishes</div>
            <div class="pill-group">${mustTry.map(f=>`<span class="pill">${f}</span>`).join('')}</div>
          </div>
          <div class="food-col-grid">
            ${fineDining.length?`<div><div class="food-col-title">Fine dining</div>${fineDining.map(r=>`<div class="food-item">${r}</div>`).join('')}</div>`:''}
            ${cafes.length?`<div><div class="food-col-title">Cafés & local spots</div>${cafes.map(c=>`<div class="food-item">${c}</div>`).join('')}</div>`:''}
          </div>
          ${hygiene.length?`<div style="margin-top:16px"><div class="food-col-title">Hygiene tips</div>${hygiene.map(h=>`<div class="tip-row"><span class="tip-arrow">→</span><span class="tip-text">${h}</span></div>`).join('')}</div>`:''}
        </div>`;
    }

    const ch=d.Culture_And_Heritage||d.culture;
    if (ch) {
      const spiritual=asArray(ch.spiritual_sites), crafts=asArray(ch.shopping_crafts), unesco=asArray(ch.unesco_sites);
      body.innerHTML += `
        <div class="section reveal">
          <div class="section-title">Culture & heritage</div>
          ${ch.historical_context?`<p style="font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:16px;padding-left:12px;border-left:2px solid var(--gold-border)">${ch.historical_context}</p>`:''}
          <div class="heritage-grid">
            ${spiritual.length?`<div class="heritage-card"><div class="heritage-card-title">Spiritual sites</div>${spiritual.map(s=>`<div class="heritage-card-body" style="padding:4px 0;border-bottom:1px solid var(--rule)">${s}</div>`).join('')}</div>`:''}
            ${crafts.length?`<div class="heritage-card"><div class="heritage-card-title">Shopping & crafts</div>${crafts.map(c=>`<div class="heritage-card-body" style="padding:4px 0;border-bottom:1px solid var(--rule)">${c}</div>`).join('')}</div>`:''}
            ${unesco.length?`<div class="heritage-card" style="grid-column:1/-1"><div class="heritage-card-title">UNESCO / Notable heritage</div>${unesco.map(u=>`<div class="heritage-card-body">${u.name||u}${u.status?' · '+u.status:''}${u.note?'<br><span style="opacity:.55">'+u.note+'</span>':''}</div>`).join('')}</div>`:''}
          </div>
        </div>`;
    }

    if (rt.seasonal_breakdown?.length) {
      body.innerHTML += `
        <div class="section reveal">
          <div class="section-title">Seasonal breakdown</div>
          <div class="season-grid sg">${rt.seasonal_breakdown.map(s=>`
            <div class="season-card reveal">
              <div class="season-name">${s.season}</div>
              <div class="season-cond">${s.conditions}</div>
              <span class="crowd-pill ${crowdClass(s.crowd_level)}">${s.crowd_level}</span>
            </div>`).join('')}
          </div>
        </div>`;
    }

    const festivals=rt.festivals||d.festivals||[];
    if (festivals.length) {
      body.innerHTML += `
        <div class="section reveal">
          <div class="section-title">Festivals & events</div>
          ${festivals.map(f=>`
            <div class="festival-row">
              <div class="festival-month">${f.month||''}</div>
              <div><div class="festival-name">${f.name}</div><div class="festival-desc">${f.description||''}</div></div>
            </div>`).join('')}
        </div>`;
    }

    const gems=d.Offbeat_Gems||d.offbeat_gems||[];
    if (gems.length) {
      body.innerHTML += `
        <div class="section reveal">
          <div class="section-title">Offbeat & hidden gems</div>
          ${gems.map(g=>`
            <div class="exp-row">
              <div>
                <div class="exp-name">${g.name}</div>
                <div style="font-size:12px;color:var(--faint);margin-top:3px">${g.why_special||''}${g.best_for?' · '+g.best_for:''}</div>
              </div>
              ${g.distance_from_town?`<div class="exp-meta"><div class="exp-dur">${g.distance_from_town}</div></div>`:''}
            </div>`).join('')}
        </div>`;
    }

    const sa=d.Safety_And_Accessibility||d.safety||{};
    const generalTips=asArray(sa.general_tips||d.hidden_tips);
    const womenTips=asArray(sa.womens_safety);
    const accSites=asArray(sa.accessibility_sites);
    const emergency=sa.emergency_contacts||d.emergency_contacts;
    const trafficTips=asArray(rt.traffic_tips);

    body.innerHTML += `<div class="section reveal"><div class="section-title">Safety & accessibility</div>`;
    if (generalTips.length) body.innerHTML += `<div style="margin-bottom:16px"><div class="food-col-title" style="margin-bottom:8px">General safety</div>${generalTips.map(t=>`<div class="tip-row"><span class="tip-arrow">→</span><span class="tip-text">${t}</span></div>`).join('')}</div>`;
    if (womenTips.length)   body.innerHTML += `<div style="margin-bottom:16px"><div class="food-col-title" style="margin-bottom:8px">Women travellers</div>${womenTips.map(t=>`<div class="tip-row"><span class="tip-arrow">→</span><span class="tip-text">${t}</span></div>`).join('')}</div>`;
    if (trafficTips.length) body.innerHTML += `<div style="margin-bottom:16px"><div class="food-col-title" style="margin-bottom:8px">Traffic tips</div>${trafficTips.map(t=>`<div class="tip-row"><span class="tip-arrow">→</span><span class="tip-text">${t}</span></div>`).join('')}</div>`;
    if (accSites.length) body.innerHTML += `
      <div style="margin-bottom:16px">
        <div class="food-col-title" style="margin-bottom:10px">Site accessibility</div>
        ${accSites.map(s=>`
          <div class="access-row">
            <div><div class="access-site">${s.site}</div><div class="access-note">${s.steps_involved?'Steps: '+s.steps_involved+' · ':''}${s.mobility_notes||''}</div></div>
            <span class="wc-badge ${s.wheelchair?'wc-yes':'wc-no'}">${s.wheelchair?'Accessible':'Limited'}</span>
          </div>`).join('')}
      </div>`;
    if (emergency) body.innerHTML += `
      <div class="emergency-grid sg">
        ${emergency.police?`<div class="emergency-card reveal"><div class="emergency-label">Police</div><div class="emergency-value">${emergency.police}</div></div>`:''}
        ${emergency.ambulance?`<div class="emergency-card reveal"><div class="emergency-label">Ambulance</div><div class="emergency-value">${emergency.ambulance}</div></div>`:''}
        ${emergency.hospital_name?`<div class="emergency-card reveal"><div class="emergency-label">Hospital</div><div class="emergency-value">${emergency.hospital_name}</div><div style="font-size:11px;color:var(--faint);margin-top:3px">${emergency.hospital_number||''}</div></div>`:''}
      </div>`;
    body.innerHTML += `</div>`;

    const pers=d.Personalization?.matches||d.personalization;
    if (pers?.length) body.innerHTML += `
      <div class="section reveal">
        <div class="section-title">Traveller match</div>
        <table class="pers-table">
          <thead><tr><th>Traveller type</th><th>Best spot</th><th>Season</th><th>Stay</th></tr></thead>
          <tbody>${pers.map(p=>`<tr><td>${p.traveler_interest}</td><td>${p.destination_match}</td><td>${p.best_season}</td><td>${p.recommended_stay}</td></tr>`).join('')}</tbody>
        </table>
      </div>`;

    const ep=d.Essential_Practicalities||d.practicalities;
    if (ep) {
      const permits=asArray(ep.permits), currency=asArray(ep.currency_tips), health=asArray(ep.health_hygiene);
      body.innerHTML += `
        <div class="section reveal">
          <div class="section-title">Essential practicalities</div>
          <div class="heritage-grid">
            ${permits.length?`<div class="heritage-card"><div class="heritage-card-title">Permits</div>${permits.map(p=>`<div class="heritage-card-body" style="padding:4px 0">${p}</div>`).join('')}</div>`:''}
            ${currency.length?`<div class="heritage-card"><div class="heritage-card-title">Currency & payments</div>${currency.map(c=>`<div class="heritage-card-body" style="padding:4px 0">${c}</div>`).join('')}</div>`:''}
            ${health.length?`<div class="heritage-card"><div class="heritage-card-title">Health & hygiene</div>${health.map(h=>`<div class="heritage-card-body" style="padding:4px 0">${h}</div>`).join('')}</div>`:''}
            ${ep.network_coverage?`<div class="heritage-card"><div class="heritage-card-title">Network coverage</div><div class="heritage-card-body">${ep.network_coverage}</div></div>`:''}
          </div>
        </div>`;
    }

    const tripsArr=asArray(d.Day_Trips||d.nearby_day_trips||[]);
    if (tripsArr.length) body.innerHTML += `
      <div class="section reveal">
        <div class="section-title">Day trips & excursions</div>
        ${typeof tripsArr[0]==='string'
          ?`<div class="trips-wrap">${tripsArr.map(t=>`<span class="trip-pill">${t}</span>`).join('')}</div>`
          :tripsArr.map(t=>`
            <div class="exp-row">
              <div>
                <div class="exp-name">${t.name}</div>
                <div style="font-size:12px;color:var(--faint);margin-top:3px">${t.highlights||''}</div>
              </div>
              <div class="exp-meta">
                ${t.distance_km?`<div class="exp-cost">${t.distance_km} km</div>`:''}
                <div class="exp-dur">${t.duration||''}${t.best_season?' · '+t.best_season:''}</div>
              </div>
            </div>`).join('')}
      </div>`;

    const resp=d.Responsible_Travel||d.responsible;
    if (resp) {
      const etiq=asArray(resp.cultural_etiquette),sust=asArray(resp.sustainability_tips),local=asArray(resp.support_local);
      if (etiq.length||sust.length||local.length) body.innerHTML += `
        <div class="section reveal">
          <div class="section-title">Responsible travel</div>
          <div class="resp-cols">
            ${etiq.length?`<div><div class="resp-col-title">Cultural etiquette</div>${etiq.map(e=>`<div class="resp-item">${e}</div>`).join('')}</div>`:''}
            ${sust.length?`<div><div class="resp-col-title">Sustainability</div>${sust.map(s=>`<div class="resp-item">${s}</div>`).join('')}</div>`:''}
            ${local.length?`<div><div class="resp-col-title">Support local</div>${local.map(l=>`<div class="resp-item">${l}</div>`).join('')}</div>`:''}
          </div>
        </div>`;
    }

    const mh=d.Media_Hub||d.media_hub;
    if (mh) {
      const videos=asArray(mh.videos),photos=asArray(mh.photography_spots),books=asArray(mh.books),apps=asArray(mh.apps);
      if (videos.length||photos.length||books.length||apps.length) body.innerHTML += `
        <div class="section reveal">
          <div class="section-title">Media hub</div>
          <div class="media-grid">
            ${videos.length?`<div class="media-card"><div class="media-card-title">Watch</div>${videos.map(v=>`<div class="media-item">${v}</div>`).join('')}</div>`:''}
            ${photos.length?`<div class="media-card"><div class="media-card-title">Photography spots</div>${photos.map(p=>`<div class="media-item">${p}</div>`).join('')}</div>`:''}
            ${books.length?`<div class="media-card"><div class="media-card-title">Read before you go</div>${books.map(b=>`<div class="media-item">${b}</div>`).join('')}</div>`:''}
            ${apps.length?`<div class="media-card"><div class="media-card-title">Useful apps</div>${apps.map(a=>`<div class="media-item">${a}</div>`).join('')}</div>`:''}
          </div>
        </div>`;
    }

    if (d.avoid) body.innerHTML += `
      <div class="section reveal">
        <div class="avoid-box">
          <div class="avoid-label">Watch out</div>
          <div class="avoid-text">${d.avoid}</div>
        </div>
      </div>`;

    /* Reveal */
    document.getElementById('loading-overlay').classList.add('hide');
    setTimeout(() => {
      document.getElementById('loading-overlay').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
      }, { threshold: 0.07 });
      document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    }, 440);
  }

  async function init() {
    if (!city) { window.location.href = 'index.html'; return; }
    document.title = 'TripSoul | ' + city;
    try {
      const res  = await fetch(`${API_URL}/handbook/${encodeURIComponent(city)}`);
      if (!res.ok) throw new Error('Status ' + res.status);
      renderHandbook(await res.json());
    } catch(err) {
      console.error(err);
      document.getElementById('loading-overlay').innerHTML = `
        <div style="text-align:center;padding:2rem">
          <p style="font-family:'Syne',sans-serif;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px">Handbook unavailable</p>
          <code style="color:var(--gold);font-size:12px">uvicorn main:app --reload</code><br><br>
          <a href="index.html" style="color:var(--gold);font-size:12px;letter-spacing:0.06em">← Back to recommendations</a>
        </div>`;
    }
  }
  init();
</script>
</body>
</html>
