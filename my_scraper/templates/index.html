<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Railway - Train Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            color: #f5f5f5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(180deg, rgba(201, 162, 20, 0.15) 0%, transparent 100%);
            border-bottom: 1px solid rgba(201, 162, 20, 0.2);
            margin-bottom: 50px;
        }

        .logo-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px rgba(201, 162, 20, 0.5));
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #c9a214;
            text-shadow: 0 0 30px rgba(201, 162, 20, 0.3);
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .search-section {
            background: linear-gradient(145deg, #141418 0%, #1a1a20 100%);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 40px;
            border: 1px solid rgba(201, 162, 20, 0.15);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto;
            gap: 20px;
            align-items: end;
        }

        .field-group {
            position: relative;
        }

        .field-label {
            display: block;
            font-size: 0.85rem;
            color: #c9a214;
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .field-icon {
            position: absolute;
            left: 18px;
            bottom: 18px;
            color: #c9a214;
            font-size: 1.1rem;
            z-index: 1;
        }

        select {
            width: 100%;
            padding: 18px 20px 18px 50px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            border: 2px solid rgba(201, 162, 20, 0.2);
            border-radius: 14px;
            background: #0f0f14;
            color: #f5f5f5;
            cursor: pointer;
            transition: all 0.3s ease;
            appearance: none;
        }

        select:hover {
            border-color: rgba(201, 162, 20, 0.5);
        }

        select:focus {
            outline: none;
            border-color: #c9a214;
            box-shadow: 0 0 20px rgba(201, 162, 20, 0.2);
        }

        select option {
            background: #141418;
            color: #f5f5f5;
            padding: 10px;
        }

        .swap-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid rgba(201, 162, 20, 0.3);
            background: #0f0f14;
            color: #c9a214;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .swap-btn:hover {
            background: #c9a214;
            color: #0a0a0f;
            transform: rotate(180deg);
            box-shadow: 0 0 25px rgba(201, 162, 20, 0.4);
        }

        .search-btn {
            padding: 18px 45px;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #c9a214 0%, #a68510 100%);
            color: #0a0a0f;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            white-space: nowrap;
        }

        .search-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(201, 162, 20, 0.4);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 80px 20px;
        }

        .train-loader {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            position: relative;
        }

        .train-loader i {
            font-size: 4rem;
            color: #c9a214;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .loading p {
            color: #888;
            font-size: 1.1rem;
        }

        .results-section {
            display: none;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 25px;
            background: linear-gradient(145deg, #141418 0%, #1a1a20 100%);
            border-radius: 18px;
            border: 1px solid rgba(201, 162, 20, 0.15);
        }

        .route-display {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.4rem;
        }

        .route-display .station {
            color: #f5f5f5;
            font-weight: 600;
        }

        .route-display .arrow {
            color: #c9a214;
            font-size: 1.5rem;
        }

        .result-count {
            background: rgba(201, 162, 20, 0.15);
            padding: 10px 22px;
            border-radius: 25px;
            color: #c9a214;
            font-weight: 500;
        }

        .result-card {
            background: linear-gradient(145deg, #141418 0%, #1a1a20 100%);
            border-radius: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(201, 162, 20, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .result-card:hover {
            transform: translateY(-5px);
            border-color: rgba(201, 162, 20, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        .card-top {
            padding: 22px 28px;
            background: linear-gradient(90deg, rgba(201, 162, 20, 0.1) 0%, transparent 100%);
            border-bottom: 1px solid rgba(201, 162, 20, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-number {
            width: 36px;
            height: 36px;
            background: #c9a214;
            color: #0a0a0f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
        }

        .option-type {
            font-size: 1.1rem;
            font-weight: 600;
            color: #c9a214;
        }

        .option-type.connecting {
            color: #e67e22;
        }

        .card-stats {
            display: flex;
            gap: 35px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: #c9a214;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-content {
            padding: 28px;
        }

        .journey-legs {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .journey-leg {
            display: flex;
            gap: 22px;
        }

        .leg-timeline {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 35px;
        }

        .leg-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #c9a214;
            border: 3px solid #1a1a20;
            box-shadow: 0 0 10px rgba(201, 162, 20, 0.3);
            z-index: 1;
        }

        .leg-line {
            width: 3px;
            background: linear-gradient(to bottom, #c9a214, rgba(201, 162, 20, 0.3));
            flex: 1;
            min-height: 50px;
        }

        .leg-body {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            padding: 22px;
            border-radius: 14px;
            border: 1px solid rgba(201, 162, 20, 0.08);
        }

        .train-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .train-icon {
            color: #c9a214;
            font-size: 1.3rem;
        }

        .train-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #f5f5f5;
        }

        .train-num {
            background: rgba(201, 162, 20, 0.15);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #c9a214;
        }

        .route-flow {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 18px;
        }

        .flow-point {
            text-align: center;
        }

        .flow-station {
            font-weight: 500;
            color: #f5f5f5;
            margin-bottom: 4px;
        }

        .flow-time {
            color: #c9a214;
            font-size: 0.9rem;
        }

        .flow-arrow {
            flex: 1;
            display: flex;
            align-items: center;
            color: #555;
        }

        .flow-arrow::before {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(to right, #c9a214, #444);
        }

        .flow-arrow::after {
            content: '\f0d9';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            color: #c9a214;
            font-size: 1.2rem;
        }

        .leg-meta {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #888;
            font-size: 0.9rem;
        }

        .meta-item i {
            color: #c9a214;
            width: 16px;
        }

        .transfer-section {
            background: rgba(230, 126, 34, 0.1);
            border: 1px dashed rgba(230, 126, 34, 0.4);
            border-radius: 12px;
            padding: 16px 22px;
            margin: 5px 0 25px 57px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .transfer-icon {
            color: #e67e22;
            font-size: 1.5rem;
        }

        .transfer-details {
            flex: 1;
        }

        .transfer-station {
            color: #e67e22;
            font-weight: 600;
        }

        .transfer-wait {
            color: #888;
            font-size: 0.9rem;
        }

        .feasibility {
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .feasibility.good {
            background: rgba(39, 174, 96, 0.2);
            color: #27ae60;
        }

        .feasibility.poor {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .no-data {
            text-align: center;
            padding: 100px 40px;
            background: linear-gradient(145deg, #141418 0%, #1a1a20 100%);
            border-radius: 20px;
            border: 1px solid rgba(201, 162, 20, 0.1);
        }

        .no-data i {
            font-size: 5rem;
            color: #333;
            margin-bottom: 25px;
        }

        .no-data h3 {
            font-size: 1.6rem;
            color: #f5f5f5;
            margin-bottom: 10px;
        }

        .no-data p {
            color: #666;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 50px 20px;
            color: #444;
            font-size: 0.85rem;
            border-top: 1px solid rgba(201, 162, 20, 0.1);
            margin-top: 60px;
        }

        footer span {
            color: #c9a214;
        }

        @media (max-width: 900px) {
            .search-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .swap-btn {
                transform: rotate(90deg);
                margin: 0 auto;
            }

            .search-btn {
                width: 100%;
                justify-content: center;
            }

            .results-header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .card-stats {
                flex-wrap: wrap;
                justify-content: center;
            }

            .card-top {
                flex-direction: column;
                gap: 15px;
            }

            .route-flow {
                flex-direction: column;
            }

            .flow-arrow {
                transform: rotate(90deg);
                width: 100%;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: slideUp 0.5s ease forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-icon">&#x1F682;</div>
            <h1>Indian Railway</h1>
            <p class="subtitle">Train Connection Finder</p>
        </header>

        <section class="search-section">
            <div class="search-grid">
                <div class="field-group">
                    <label class="field-label">From</label>
                    <i class="fas fa-train field-icon"></i>
                    <select id="source">
                        <option value="">Select departure</option>
                        {% for station in stations %}
                        <option value="{{ station }}">{{ station }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button class="swap-btn" onclick="swapStations()" title="Swap stations">
                    <i class="fas fa-exchange-alt"></i>
                </button>

                <div class="field-group">
                    <label class="field-label">To</label>
                    <i class="fas fa-map-marker-alt field-icon"></i>
                    <select id="destination">
                        <option value="">Select arrival</option>
                        {% for station in stations %}
                        <option value="{{ station }}">{{ station }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button class="search-btn" onclick="searchConnections()">
                    <i class="fas fa-search"></i>
                    Find Trains
                </button>
            </div>
        </section>

        <div class="loading" id="loading">
            <div class="train-loader">
                <i class="fas fa-train"></i>
            </div>
            <p>Searching for available trains...</p>
        </div>

        <section class="results-section" id="results"></section>

        <footer>
            <p>Indian Railway Connection Finder <span>|</span> Powered by Machine Learning</p>
        </footer>
    </div>

    <script>
        function swapStations() {
            const src = document.getElementById('source');
            const dst = document.getElementById('destination');
            const temp = src.value;
            src.value = dst.value;
            dst.value = temp;
        }

        async function searchConnections() {
            const source = document.getElementById('source').value;
            const destination = document.getElementById('destination').value;

            if (!source || !destination) {
                alert('Please select both departure and arrival stations');
                return;
            }

            document.getElementById('results').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                const response = await fetch(`/api/connections?source=${encodeURIComponent(source)}&destination=${encodeURIComponent(destination)}`);
                const data = await response.json();
                renderResults(data);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('results').innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Something went wrong</h3>
                        <p>Please try again later or check your connection.</p>
                    </div>
                `;
                document.getElementById('results').style.display = 'block';
            }

            document.getElementById('loading').style.display = 'none';
        }

        function renderResults(data) {
            const container = document.getElementById('results');
            
            if (!data.connections || data.connections.length === 0) {
                container.innerHTML = `
                    <div class="no-data">
                        <i class="fas fa-search"></i>
                        <h3>No Trains Found</h3>
                        <p>No direct or connecting trains available between ${data.source} and ${data.destination}</p>
                    </div>
                `;
                container.style.display = 'block';
                return;
            }

            let html = `
                <div class="results-header animate-in">
                    <div class="route-display">
                        <span class="station">${data.source}</span>
                        <i class="fas fa-arrow-right arrow"></i>
                        <span class="station">${data.destination}</span>
                    </div>
                    <div class="result-count">
                        <i class="fas fa-ticket-alt"></i> ${data.connections.length} Option${data.connections.length > 1 ? 's' : ''}
                    </div>
                </div>
            `;

            data.connections.forEach((conn, i) => {
                const isConnecting = conn.type !== 'DIRECT';
                const typeText = isConnecting ? 'Connecting' : 'Direct';
                
                html += `
                    <div class="result-card animate-in" style="animation-delay: ${i * 0.15}s">
                        <div class="card-top">
                            <div class="option-label">
                                <div class="option-number">${i + 1}</div>
                                <span class="option-type ${isConnecting ? 'connecting' : ''}">${typeText}</span>
                            </div>
                            <div class="card-stats">
                                <div class="stat-item">
                                    <div class="stat-value">${conn.total_distance_km.toFixed(0)}</div>
                                    <div class="stat-label">KM</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${conn.estimated_total_time_hours.toFixed(1)}h</div>
                                    <div class="stat-label">Duration</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-value">${conn.estimated_delay_min.toFixed(0)}</div>
                                    <div class="stat-label">Delay (min)</div>
                                </div>
                            </div>
                        </div>
                        <div class="card-content">
                            <div class="journey-legs">
                `;

                conn.legs.forEach((leg, legIdx) => {
                    const isFirst = legIdx === 0;
                    const isLast = legIdx === conn.legs.length - 1;
                    
                    html += `
                        <div class="journey-leg">
                            <div class="leg-timeline">
                                <div class="leg-dot"></div>
                                ${!isLast ? '<div class="leg-line"></div>' : ''}
                            </div>
                            <div class="leg-body">
                                <div class="train-header">
                                    <i class="fas fa-subway train-icon"></i>
                                    <span class="train-title">${leg.train_name}</span>
                                    <span class="train-num">#${leg.train_no}</span>
                                </div>
                                <div class="route-flow">
                                    <div class="flow-point">
                                        <div class="flow-station">${leg.source}</div>
                                        <div class="flow-time">${leg.scheduled_time}</div>
                                    </div>
                                    <div class="flow-arrow"></div>
                                    <div class="flow-point">
                                        <div class="flow-station">${leg.destination}</div>
                                        <div class="flow-time">--:--</div>
                                    </div>
                                </div>
                                <div class="leg-meta">
                                    <div class="meta-item">
                                        <i class="fas fa-road"></i>
                                        ${leg.distance_km} km
                                    </div>
                                    <div class="meta-item">
                                        <i class="fas fa-clock"></i>
                                        Avg delay: ${leg.avg_delay_min} min
                                    </div>
                                    <div class="meta-item">
                                        <i class="fas fa-calendar"></i>
                                        ${leg.frequency}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    if (legIdx < conn.transfer_stations.length) {
                        const transfer = conn.transfer_stations[legIdx];
                        const wait = conn.transfer_wait_hours ? ` (${conn.transfer_wait_hours}h wait)` : '';
                        const feasible = conn.feasible ? 'good' : 'poor';
                        const feasibleText = conn.feasible ? 'Recommended' : 'Not Recommended';
                        
                        html += `
                            <div class="transfer-section">
                                <i class="fas fa-random transfer-icon"></i>
                                <div class="transfer-details">
                                    <div class="transfer-station">Change at ${transfer}${wait}</div>
                                    <div class="transfer-wait">
                                        <span class="feasibility ${feasible}">${feasibleText}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                });

                html += `
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            container.style.display = 'block';
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchConnections();
            }
        });
    </script>
</body>
</html>
